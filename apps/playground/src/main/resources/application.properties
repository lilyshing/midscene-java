# Spring Boot 应用配置
server.port=8080
server.servlet.context-path=/playground
server.compression.enabled=true

# HTTP连接池配置
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.accept-count=200
server.tomcat.max-http-form-post-size=2MB

# Thymeleaf配置
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# 应用配置
midscene.playground.session-timeout=1800000
midscene.playground.max-sessions=100
midscene.playground.cleanup-interval=60000

# 资源管理配置
midscene.playground.max-memory-mb=2048
midscene.playground.connection-pool.max-total=100
midscene.playground.connection-pool.max-idle=50
midscene.playground.connection-pool.min-idle=10
midscene.playground.connection-pool.max-wait-ms=5000
midscene.playground.connection-pool.time-between-eviction-runs-ms=60000

# WebSocket配置
spring.mvc.async.request-timeout=30000
spring.websocket.servlet.path=/playground/ws
spring.websocket.message-broker.broker-relay.auto-startup=true

# 日志配置
logging.level.root=INFO
logging.level.com.midscene=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# CORS配置
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# JVM监控
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true