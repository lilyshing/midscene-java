# Server configuration
server.port=8082
server.servlet.context-path=/android-playground

# Spring Thymeleaf configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Logging configuration
logging.level.root=INFO
logging.level.com.midscene=DEBUG

# Android Playground configuration
android.playground.adb.path=C:/adb/platform-tools/adb.exe
android.playground.scrcpy.path=C:/adb/scrcpy/scrcpy.exe
android.playground.socket.port=8083

# Maximum allowed size for video frames
android.playground.max.frame.size=1024